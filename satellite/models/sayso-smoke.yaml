# SaySo wake-word smoke recipe — LiveKit test.yaml scale.
#
# Pipeline wiring only (setup → generate → augment → train → export → eval).
# Not a quality target. Still runs generate; never skip it.
#
#   python3 scripts/wake_livekit_run.py run \
#     --config satellite/models/sayso-smoke.yaml \
#     --work-dir /tmp/sayso-wake-smoke

model_name: sayso_smoke

target_phrases:
  - "SaySo"
  - "Sayso"

n_samples: 100
n_samples_val: 20
n_background_samples: 50
n_background_samples_val: 10
tts_batch_size: 10

custom_negative_phrases:
  - "say so"
  - "says so"
  - "said so"

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 8
  rounds: 3
  background_paths: ["./data/backgrounds"]
  rir_paths: ["./data/rirs"]

model:
  model_type: dnn
  model_size: tiny

steps: 500
learning_rate: 0.001
max_negative_weight: 1000
target_fp_per_hour: 1.0

batch_n_per_class:
  positive: 10
  adversarial_negative: 10
  ACAV100M_sample: 64
  background_noise: 10
