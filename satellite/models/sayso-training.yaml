# Retrain config for the SaySo wake classifier. Deliberately small.
#
# READ THIS BEFORE RUNNING: the satellite was scoring misaligned windows until
# 2026-09-09. WakeAudioBuffer advanced by the caller's chunk size rounded up to
# the hop -- 4000 samples, 25 mel frames -- instead of a fixed 160 ms, so the
# phrase landed at an arbitrary offset in every window and ~36% of windows were
# dropped outright. The observed ceiling of 0.57-0.72 on genuine wakes was
# measured under that bug. Re-measure the CURRENT model on the fixed pipeline
# before training anything: the ceiling may lift on its own, and retraining to
# fix a symptom that no longer exists wastes a cycle and bakes in the wrong
# operating point.
#
# Baseline to beat (satellite/models/sayso_eval.json):
#   aut 0.0084 | recall 0.598 @ t=0.5 | optimal_threshold 0.19 | fpph 0.2467
#
# Wake rule (decided 2026-09-14): the phrase /seI soU/ wakes only in isolation
# -- any word in front of it disqualifies the wake, a word after it does not.
# This config is where that rule is encoded: `target_phrases` carries both
# realizations, and `custom_negative_phrases` carries the carriers. Read
# docs/WAKE_WORD_DATA.md before editing either list.
#
# Two item-5 levers are NOT configurable here and need an upstream patch:
# `AudioAugmentor` has no gain/level transform (EQ, tanh distortion, RIR,
# background at 5-15 dB SNR only) and `align_clip_to_end` hardcodes 0-200 ms
# jitter as a function default. Production audio sits ~22 dB below the TTS
# positives, so level robustness matters; do it by patching the installed
# package or vendoring `data/augment.py`, not by hoping a YAML key exists.
#
# Why the numbers below are small: 126.8 hours of production telemetry put the
# bulk of conversational audio at p50 0.0039 and p99.9 0.0311. The model is not
# broadly confused -- 99.99% of real audio is already below 0.19. The entire
# false-positive problem is ~116 windows out of 456,382. You cannot fix a tail
# that thin with volume, and generic negatives do not touch it. Coverage of the
# specific confusion is the only lever that matters.

model_name: sayso
# Both realizations of /seɪ soʊ/, both targets. They are different acoustic
# events -- one token vs two stress groups with a possible juncture -- so both
# must be generated; augmentation cannot derive one from the other.
#
# What the real spool attests: 78 of 152 mined windows transcribe as two-word
# "say so" and 0 as fused "Sayso". The fused token is therefore the rendering
# with the least evidence behind it, not the default to extrapolate from. Do not
# drop it: `wake_word.phrase` is "SaySo" and the brand name is spoken that way.
# Do not add an onset word ("Hey Sayso") -- under the isolation rule that is not
# a wake at all.
target_phrases:
  - "Sayso"
  - "say so"

# Below the upstream default of 10000/2000, not above it. More synthetic
# positives of the same character do not add coverage; the corpus already
# contained 19200 positives and still could not separate.
n_samples: 8000
n_samples_val: 2000
n_background_samples: 300
n_background_samples_val: 80
# Measured on the retrain host, and the lever that decides whether this run is
# 1 hour or 36: the VITS decoder pads every sequence in a batch to the longest
# one, so batching a 2-word phrase costs far more than it saves.
#   batch 8 -> 0.35 s/clip | batch 16 -> 3.9 s/clip | batch 50 -> 10.4 s/clip
# Keep this small unless the backend's padding behaviour changes.
tts_batch_size: 8

# VoxCPM was the original choice: it generates from free-text persona prompts,
# so more distinct underlying voices than Piper's SLERP-blended speaker table.
# It is no longer affordable on the retrain host. Measured on an M1: VoxCPM2 is
# 184 s per clip, so 8000 samples x 2 realizations plus the negatives is ~42
# days; Piper is 0.21 s per clip, ~1.2 h for the same 20000-clip set. Revisit on
# a CUDA host -- switch this line back and re-run setup (~5 GB of weights).
tts_backend: piper_vits

# The one high-value negative set: /seI soU/ said after another word.
#
# Wake rule (decided): the phrase must be ISOLATED. Any word in front of it
# disqualifies the wake; a word after it does not ("SaySo turn on the TV" is
# still a wake -- that is the continuous-command shape the product needs). This
# list is where that rule is taught, so the entries below split into exactly two
# kinds and nothing else.
#
# 1. CARRIERS -- the phrase with a word in front of it. These are the only
#    places the model ever sees the target preceded by speech. "say so" itself
#    is NOT here: it is a target now, and listing a target as its own negative
#    is the contradiction that parked the whole /seI soU/ family on the decision
#    boundary. Do not re-add it.
#
# 2. NEAR-MISSES -- different sounds that score like the target. Measured, not
#    guessed: "stay so" scores 0.792 on clean TTS against a 0.647-0.715 positive
#    band, "see you soon" 0.313 on TTS and 0.643 on real living-room audio.
#
# Generic fillers ("okay", "yeah", "hello", "no") are still deliberately NOT
# here: they are what livekit falls back to when no adversarial phrases exist,
# they are trivially separable, and thousands of them is precisely the "large
# corpus, poor effective coverage" failure this file exists to avoid.
#
# PROVENANCE: these are still synthetic TTS phrases, not captures of real false
# activations. Measured real negatives now exist in the mine spool
# (/var/lib/sayso-satellite/wake-mining: "Good boy", "So so.", "New players
# available", "Home Assistant") and belong in `data/negative_train` as clips
# once labelled -- see docs/PLAN_WAKE_WORD_REAL_DATA.md item 3. Do not grow this
# list to cover them; a TTS rendering of a dog barking teaches nothing.
custom_negative_phrases:
  # Carriers: the phrase with a word in front of it.
  - "if you say so"
  - "just say so"
  - "you don't say so"
  - "they say so"
  # Near-misses: distinct sounds that score in the target's band. "saying so"
  # was measured before being kept (it is not a carrier -- nothing precedes the
  # phrase): 0.308 against 0.540 for "say so" on the same voice and the same
  # sliding-window path, i.e. near-miss band, well under the 0.647-0.715 real
  # positive band. Re-measure if it is ever suspected of carrying the target.
  - "says so"
  - "said so"
  - "saying so"
  - "stay so"
  - "see you soon"
  - "so so"
  - "same so"
  - "safe so"
  - "say slow"
  - "say show"
  - "say sorry"
  - "say something"
  - "essay so"
  - "hey so"
  - "lasso"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  # Two passes, not one: the satellite mic is a Blue Snowball across a living
  # room, so reverb and background robustness are real coverage, not padding.
  rounds: 2
  # Two background sources: MUSAN for generic noise, and the live room's own
  # phrase-free captures so the model hears the actual microphone, reverb and
  # household clutter it will be deployed in. --live-backgrounds fills the
  # second directory; augmentation picks between them at random.
  background_paths: ["./data/backgrounds", "./data/live-backgrounds"]
  rir_paths: ["./data/rirs"]

model:
  # Unchanged from the shipped model. A p50 of 0.0039 across 126.8 hours is not
  # what an under-capacity classifier looks like, and a bigger head would cost
  # ~10x the inference the satellite just clawed back. Revisit only if a
  # coverage-fixed retrain still cannot separate.
  model_type: conv_attention
  model_size: small

# 30k phase-1 steps; the trainer adds steps//10 refinement and steps//10
# fine-tune on top (36k total). A small corpus does not need 120k steps to
# converge and will only overfit its own redundancy.
steps: 30000
learning_rate: 1.0e-4
weight_decay: 1.0e-2
label_smoothing: 0.05
max_negative_weight: 3000.0

# The load-bearing number. The upstream default of 0.2 is what produced the
# mess: the model could not meet even that, so find_best_threshold() fell
# through to its max-balanced-accuracy fallback and emitted 0.19. At 0.02 the
# trainer must actually earn its threshold or double max_negative_weight trying.
#
# Caveat for this run: it is seeded with `setup --skip-acav`. ACAV100M is a
# single 17.5 GB features file and the retrain host had 20.4 GB free, so the
# fpph estimate rests on validation_set_features.npy plus the synthetic and real
# negatives instead of 2000 hours of general speech. Re-run setup without
# --skip-acav on a host with the disk before quoting the absolute fpph figure;
# the specific confusion this model fails on is covered either way.
target_fp_per_hour: 0.02

batch_n_per_class:
  positive: 50
  # 2x the positives. The confusable set is small and must dominate the
  # gradient; that is the whole quality thesis of this file.
  adversarial_negative: 100
  # Halved from the 1024 default. This is the generic ACAV100M pool -- it
  # anchors the false-positive-per-hour estimate but teaches almost nothing
  # about the actual confusion, and at 1024/batch it drowns the negatives that
  # do.
  ACAV100M_sample: 512
  background_noise: 50
