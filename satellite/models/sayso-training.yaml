# DEPRECATED — superseded by sayso.yaml (LiveKit generate-first prod recipe).
#
# This file preserved the older VoxCPM + phonetic-hard-negative experiment.
# Do not use it as the current training contract. For the next model:
#
#   python3 scripts/wake_livekit_run.py run \
#     --config satellite/models/sayso.yaml \
#     --work-dir /srv/llm/wake/runs/livekit-restart
#
# Shipped Pi operating point remains living2 + mel verifier until a later
# qualified export replaces it.

model_name: sayso
target_phrases:
  - "Sayso"

# Below the upstream default of 10000/2000, not above it. More synthetic
# positives of the same character do not add coverage; the corpus already
# contained 19200 positives and still could not separate.
n_samples: 8000
n_samples_val: 2000
n_background_samples: 300
n_background_samples_val: 80
tts_batch_size: 50

# DEPRECATED: VoxCPM was an experiment; Piper (default) is the restart contract.
tts_backend: voxcpm

custom_negative_phrases:
  - "say so"
  - "says so"
  - "said so"
  - "saying so"
  - "if you say so"
  - "just say so"
  - "you don't say so"
  - "so so"
  - "stay so"
  - "same so"
  - "safe so"
  - "say slow"
  - "say show"
  - "say sorry"
  - "say something"
  - "essay so"
  - "hey so"
  - "they say so"
  - "lasso"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 2
  background_paths: ["./data/backgrounds"]
  rir_paths: ["./data/rirs"]

model:
  model_type: conv_attention
  model_size: small

steps: 30000
learning_rate: 1.0e-4
weight_decay: 1.0e-2
label_smoothing: 0.05
max_negative_weight: 3000.0
target_fp_per_hour: 0.02

batch_n_per_class:
  positive: 50
  adversarial_negative: 100
  ACAV100M_sample: 512
  background_noise: 50
