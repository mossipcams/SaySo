[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sayso-satellite"
version = "0.1.0"
description = "SaySo overlay for OHF-Voice/linux-voice-assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "linux-voice-assistant @ git+https://github.com/OHF-Voice/linux-voice-assistant.git@b55d36af522c263eeed4e023d6ebf30da47e4710",
    "livekit-wakeword==0.3.0",
    "numpy>=2,<3",
    "onnxruntime==1.31.0",
    "python-mpv>=1,<2",
    "PyYAML>=6,<7",
    "soundcard<1",
    "webrtc-noise-gain>=1,<2",
]

[tool.uv]
package = false
