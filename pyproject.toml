[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sayso"
version = "1.20.4"
description = "Fully local Home Assistant conversation agent using llama.cpp"
requires-python = ">=3.12"
dependencies = [
    "homeassistant>=2026.8.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]
test = [
    "homeassistant>=2026.8.3",
    # Only Home Assistant <= 2026.8 ships this; kept so the legacy conversion
    # path in schema.py stays covered on newer Home Assistant.
    "voluptuous-openapi>=0.4.1",
    "hassil>=2.0.5",
    "home-assistant-intents>=2024.12.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-homeassistant-custom-component>=0.13",
    "hypothesis>=6.0.0",
    "import-linter>=2.0",
    "PyTurboJPEG==1.8.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "evals/tests", "satellite/sayso"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    "satellite",
    "training",
    "scripts",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "B", "ASYNC", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"custom_components/sayso/ducking.py" = ["ASYNC109"]
"custom_components/sayso/core/history.py" = ["RUF001"]
"evals/cases.py" = ["RUF001"]
"evals/scorer.py" = ["RUF001"]
"tests/test_history_question_gate.py" = ["RUF001"]
"tests/test_realistic_v3.py" = ["RUF001"]

[tool.ruff.format]
exclude = [
    "custom_components/**",
    "docs/**",
    "evals/**",
    "satellite/**",
    "scripts/**",
    "tests/**",
    "training/**",
    "sayso_contract.py",
]

[tool.importlinter]
root_packages = ["custom_components", "satellite"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core must not import Home Assistant"
type = "forbidden"
source_modules = ["custom_components.sayso.core"]
forbidden_modules = ["homeassistant"]

[[tool.importlinter.contracts]]
name = "satellite must not import custom_components"
type = "forbidden"
source_modules = ["satellite"]
forbidden_modules = ["custom_components"]
