name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
          python -m pip install numpy PyYAML
          python <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import homeassistant

          from scripts.compat_matrix import (
              COMPONENT_REQUIREMENT_ROOTS,
              collect_integration_requirements,
          )

          components_dir = Path(homeassistant.__file__).resolve().parent / "components"
          reqs = collect_integration_requirements(
              components_dir,
              COMPONENT_REQUIREMENT_ROOTS["current"],
          )
          if reqs:
              subprocess.run([sys.executable, "-m", "pip", "install", *reqs], check=True)
          PY

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest

  satellite:
    name: Satellite unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest numpy PyYAML

      - name: Parse linux-voice-assistant pin
        id: lva_pin
        run: |
          LVA_SHA=$(python3 -c "
          import re
          from pathlib import Path
          text = Path('satellite/pyproject.toml').read_text(encoding='utf-8')
          m = re.search(
              r'linux-voice-assistant @ git\+https://github.com/OHF-Voice/linux-voice-assistant\.git@([0-9a-f]+)',
              text,
          )
          if not m:
              raise SystemExit('linux-voice-assistant pin not found in satellite/pyproject.toml')
          print(m.group(1))
          ")
          echo "sha=${LVA_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned linux-voice-assistant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: OHF-Voice/linux-voice-assistant
          ref: ${{ steps.lva_pin.outputs.sha }}
          path: .lva
          fetch-depth: 1

      - name: Apply SaySo LVA patches
        run: |
          git -C .lva apply --verbose "$GITHUB_WORKSPACE/satellite/patches/0001-sayso-stable-device-name.patch"
          git -C .lva apply --verbose "$GITHUB_WORKSPACE/satellite/patches/0002-lva-external-wake-provider.patch"

      - name: Run satellite tests
        env:
          SAYSO_LVA_SRC: ${{ github.workspace }}/.lva
        run: pytest -q satellite/sayso

  compat:
    name: HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: current
            ha: "2026.8.3"
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Validate matrix metadata
        run: python scripts/compat_matrix.py matrix-json | tee matrix.json

      - name: Create isolated virtualenv
        env:
          SAYSO_COMPAT_VENV_ROOT: ${{ runner.temp }}
        run: python scripts/compat_matrix.py setup ${{ matrix.id }}

      - name: Run compatibility tests
        env:
          SAYSO_COMPAT_VENV_ROOT: ${{ runner.temp }}
        run: python scripts/compat_matrix.py run-tests ${{ matrix.id }}

  live-llama:
    name: Live llama.cpp latency (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: current
            ha: "2026.8.3"
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Create isolated virtualenv
        env:
          SAYSO_COMPAT_VENV_ROOT: ${{ runner.temp }}
        run: python scripts/compat_matrix.py setup ${{ matrix.id }}

      - name: Run live llama.cpp benchmark
        env:
          SAYSO_COMPAT_VENV_ROOT: ${{ runner.temp }}
          LLAMA_BASE_URL: ${{ vars.LLAMA_BASE_URL }}
          LLAMA_MODEL: ${{ vars.LLAMA_MODEL }}
        run: |
          if [ -z "${LLAMA_BASE_URL}" ] || [ -z "${LLAMA_MODEL}" ]; then
            echo "Set repository variables LLAMA_BASE_URL and LLAMA_MODEL to run live latency."
            exit 1
          fi
          VENV="${RUNNER_TEMP}/sayso-compat-${{ matrix.id }}"
          "$VENV/bin/pytest" tests/test_live_latency.py -k "live_latency" -v
