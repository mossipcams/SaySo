[project]
name = "sayso-satellite"
version = "0.1.0"
description = "SaySo satellite: Mac smart-speaker client"
requires-python = ">=3.12"
dependencies = ["websockets>=13.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sayso_satellite"]
