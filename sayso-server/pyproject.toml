[project]
name = "sayso-server"
version = "0.1.0"
description = "SaySo server: language understanding and deterministic control"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sayso_server"]
